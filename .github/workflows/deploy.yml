name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          # "/<repo>" for project sites, "" for user sites or custom domains.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Full site URL, used for link previews in Slack etc.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Set these under Settings → Secrets and variables → Actions → Variables.
          VITE_FORM_EMBED_URL: ${{ vars.VITE_FORM_EMBED_URL }}
          VITE_FORM_LINK: ${{ vars.VITE_FORM_LINK }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
