<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141413" />
    <meta name="description" content="Find Claude Ambassadors around the world — explore the globe by university and get in touch." />
    <link rel="icon" type="image/svg+xml" href="/clawd.svg" />
    <title>Claude Ambassadors · World Map</title>

    <!-- Link previews (Slack, Teams, LinkedIn, X, iMessage…). Crawlers need absolute URLs;
         VITE_SITE_URL is set by the deploy workflow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Claude Ambassadors" />
    <meta property="og:title" content="Claude Ambassadors · World Map" />
    <meta property="og:description" content="Find a Claude Ambassador at your university, anywhere in the world — or put your campus on the map." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Claude Ambassadors: Clawd on a globe next to a 3D map of ambassador locations" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Claude Ambassadors · World Map" />
    <meta name="twitter:description" content="Find a Claude Ambassador at your university, anywhere in the world." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
